; CLEVER Player example configuration (production)
; Copy values into ~/clever-console/config.ini or edit that file directly.
; Restart CLEVER Player after saving.

[PLAYER]
PLAYER_NAME=Lobby-01
PLAYER_LOCATION=Main entrance
PLAYER_DESCRIPTION=Lobby video wall
PLAYER_GROUP=site-a
PLAYER_TAGS=lobby,entrance
SERIAL_KEY=
TEMPLATE_ID=1
CTRL_TYPE=videowall

[DEVICE]
DEVICE_ID=lobby-01
DEVICE_SERIAL=
DEVICE_TYPE=videowall

[SERVER]
SERVER_URL=https://clever.example.com
API_URL=https://clever.example.com/api
HOST=clever.example.com
CONTROLLER_PORT=80
WEB_PORT=9100
MEDIA_PORT=9200
SCREEN_PORT=9300
SCREEN_API_PORT=9301
REMOTE_DESKTOP_PORT=9400
HEARTBEAT_INTERVAL=30
HEARTBEAT_RETRY=3
SYNC_INTERVAL=60

[DISPLAY]
FULLSCREEN=true
KIOSK_MODE=true

[CONTENT]
CACHE_ENABLED=true
CACHE_PATH=cache
CACHE_SIZE_MB=5000
CACHE_CLEANUP_DAYS=30
DOWNLOAD_RETRY=3

[PLAYBACK]
DEFAULT_VOLUME=80
MUTE=false
WEBVIEW_ZOOM=100
PLAYBACK_RETRY_COUNT=3
MEDIA_TIMEOUT=60
MEDIA_LOAD_TIMEOUT=60
WEBVIEW_LOAD_TIMEOUT=120
PDF_RENDER_TIMEOUT=60

[SCREENSHOT]
SCREENSHOT_ENABLED=true
SCREENSHOT_INTERVAL=300
SCREENSHOT_QUALITY=80

[MONITORING]
CPU_MONITORING=true
MEMORY_MONITORING=true
NETWORK_MONITORING=true
STORAGE_MONITORING=true

[WATCHDOG]
WATCHDOG_ENABLED=true
WATCHDOG_RESTART_ON_CRASH=true
WATCHDOG_MAX_CRASH_COUNT=5

[RECOVERY]
AUTO_RECOVER_WEBVIEW=true
AUTO_RECOVER_PLAYLIST=true
AUTO_RECOVER_NETWORK=true

[LOGGING]
LOG_LEVEL=INFO
LOG_RETENTION_DAYS=30
MAX_LOG_SIZE_MB=100

[UPDATER]
AUTO_UPDATE=true
UPDATE_CHANNEL=latest
CHECK_INTERVAL_HOURS=6
AUTO_INSTALL_ON_RESTART=true

[NETWORK]
OFFLINE_MODE=false
NETWORK_TIMEOUT=30

[ADVANCED]
DEV_MODE=false
DEBUG_MODE=false
ENABLE_DEVTOOLS=false
