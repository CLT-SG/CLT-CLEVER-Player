; CLEVER Player example configuration (production)
; Copy values into ~/clever-console/config.ini or edit that file directly.
; Restart CLEVER Player after saving.

[PLAYER]
SERIAL_KEY=
TEMPLATE_ID=1
CTRL_TYPE=videowall

[DEVICE]
DEVICE_ID=lobby-01
DEVICE_SERIAL=

[SERVER]
HOST=clever.example.com
CONTROLLER_PORT=80
WEB_PORT=9100
MEDIA_PORT=9200
SCREEN_PORT=9300
SCREEN_API_PORT=9301
REMOTE_DESKTOP_PORT=9400
HEARTBEAT_INTERVAL=30
HEARTBEAT_RETRY=3
SYNC_INTERVAL=60

[DISPLAY]
ALWAYS_ON_TOP=true
FULLSCREEN=false
KIOSK_MODE=false

[CONTENT]
CACHE_ENABLED=true
CACHE_PATH=cache
CACHE_SIZE_MB=5000
CACHE_CLEANUP_DAYS=30
DOWNLOAD_RETRY=3

[SCREENSHOT]
SCREENSHOT_ENABLED=true
SCREENSHOT_INTERVAL=300
SCREENSHOT_QUALITY=80

[MONITORING]
CPU_MONITORING=true
MEMORY_MONITORING=true
NETWORK_MONITORING=true
STORAGE_MONITORING=true

[WATCHDOG]
WATCHDOG_ENABLED=true
WATCHDOG_RESTART_ON_CRASH=true
WATCHDOG_MAX_CRASH_COUNT=5

[RECOVERY]
AUTO_RECOVER_WEBVIEW=true
AUTO_RECOVER_PLAYLIST=true
AUTO_RECOVER_NETWORK=true

[LOGGING]
LOG_LEVEL=INFO
LOG_RETENTION_DAYS=30
MAX_LOG_SIZE_MB=100

[UPDATER]
AUTO_UPDATE=true
UPDATE_CHANNEL=latest
CHECK_INTERVAL_HOURS=6
AUTO_INSTALL_ON_RESTART=true

[NETWORK]
OFFLINE_MODE=false
NETWORK_TIMEOUT=30

[ADVANCED]
DEV_MODE=false
DEBUG_MODE=false
ENABLE_DEVTOOLS=false
