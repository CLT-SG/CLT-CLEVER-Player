<!DOCTYPE html>
<html lang="en">

<head>
  <title>eCLess Player</title>

  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/jquery.min.js"></script>

  <script>
    try {
      var ipcRenderer = window.ipcRenderer
      var remote = window.remote
      var convert = window.xmljs
      var datetime = window.datetime
      var path = window.path
      var os = window.os
      var config = window.config
      var macaddress = window.macaddress
      var QRCode = window.QRCode
    } catch (e) {
      console.log('error module : ' + e)
    }
  </script>
  <style>
    body {
      background-size: cover;
      background-repeat: no-repeat;
      background-size: 100%;
      background-attachment: fixed;
      height: 100%;
      width: 100%;
      text-align: center;
      background-color: white;
      color: black;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 15px;
    }

    .clessinfo-parent {
      width: 100%;
      height: auto;
    }

    .title {
      margin: 15px 0 15px 0;
      font-size: 30px;
    }

    .desc {
      text-transform: uppercase;
      display: inline;
      margin: 10px 0 10px 0;
    }

    .company {
      margin: 15px 0 15px 0;
    }

    .result {
      display: inline;
      color: green;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: rgb(0, 66, 0);
      text-align: left;
      vertical-align: top;
      font-size: 5vw;
      color: white;
      white-space: pre-wrap;
    }

    .activate {
      font-size: 2.2em;
    }

    .btnSubmit {
      border: none;
      border-radius: 1.5rem;
      padding: 1%;
      width: 20%;
      cursor: pointer;
      background: #0062cc;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="activate" style="margin-top:10%;">The activation key is required.</div>
  <div class="activate" style="margin-top:5%;">Please contact us sales@closed-loop.biz for license key or</div>
  <div class="activate">Scan QR code below to request key</div>
  <div class="activate">Whatsapp</div>
  <canvas id="canvas"></canvas>
  <div class="activate mac">MAC Address :</div>
  <div class="activate" style="margin-top:5%;">Configure here</div>
  <button type="button" class="btnSubmit" id="config">Configure</button>
</body>

<script>
  var canvas = document.getElementById('canvas')
  macaddress.one(function (err, mac) {
    $('.mac').text('MAC Address : ' + mac)
    QRCode.toCanvas(canvas,
      'https://api.whatsapp.com/send?phone=6588995538&text=Hello%2C%20pls%20generate%20my%20eCLESS%20key.%20Mac%20address%20%3D%20' +
      mac +
      '%20Thanks.',
      function (error) {
        if (error) console.error(error)
        console.log('success!')
      })
  })
  $('#config').on('click', function () {
    remote.getCurrentWindow().loadURL('file://' + remote.app.getAppPath() + '/src/configure.html')
  })
  if (typeof (require) != "undefined") {
    remote.getCurrentWindow().setBounds({
      y: 0,
      x: 0,
      width: screen.width,
      height: screen.height
    })
    remote.getCurrentWindow().center()
  } else {
    console.log('electron required')
  }
</script>

</html>
