<!DOCTYPE html>
<html lang="en">

<head>
  <title>CLEVER Player</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.whatsapp.com;">
  <script src="assets/js/jquery.min.js"></script>
  <style>
    body {
      background-size: cover;
      background-repeat: no-repeat;
      background-size: 100%;
      background-attachment: fixed;
      height: 100%;
      width: 100%;
      text-align: center;
      background-color: white;
      color: black;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 15px;
    }

    .activate {
      font-size: 2.2em;
    }

    .btnSubmit {
      border: none;
      border-radius: 1.5rem;
      padding: 1%;
      width: 20%;
      cursor: pointer;
      background: #0062cc;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="activate" style="margin-top:10%;">The activation key is required.</div>
  <div class="activate" style="margin-top:5%;">Please contact us sales@closed-loop.biz for license key or</div>
  <div class="activate">Scan QR code below to request key</div>
  <div class="activate">Whatsapp</div>
  <img id="qr" alt="Activation QR code" />
  <div class="activate mac">MAC Address :</div>
  <div class="activate" style="margin-top:5%;">Configure here</div>
  <button type="button" class="btnSubmit" id="config">Configure</button>
</body>

<script>
  async function renderActivation() {
    try {
      const mac = await window.cleverPlayer.getMac()
      $('.mac').text('MAC Address : ' + mac)
      const qrUrl = 'https://api.whatsapp.com/send?phone=6588995538&text=Hello%2C%20pls%20generate%20my%20eCLESS%20key.%20Mac%20address%20%3D%20' + encodeURIComponent(mac) + '%20Thanks.'
      const dataUrl = await window.cleverPlayer.getQrDataUrl(qrUrl)
      document.getElementById('qr').src = dataUrl
    } catch (error) {
      console.error(error)
    }
  }

  renderActivation()

  $('#config').on('click', function () {
    if (window.cleverPlayer) {
      window.cleverPlayer.loadConfigure()
    }
  })
</script>

</html>
