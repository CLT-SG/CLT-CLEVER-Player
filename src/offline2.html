<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <link rel="stylesheet" type="text/css" href="assets/js/fullpagejs/fullpage.min.css" />
  <link rel="stylesheet" type="text/css" href="assets/css/examples.css" />
  <link rel="stylesheet" type="text/css" href="assets/css/fontawesome.min.css" />
  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>
  <style>
    /* Style for our header texts
    * --------------------------------------- */
    h1 {
      font-size: 5em;
      font-family: arial, helvetica;
      color: #fff;
      margin: 0;
      padding: 40px 0 0 0;
    }

    .intro p {
      color: #fff;
      padding: 40px 0 0 0;
    }

    .wrap {
      margin-left: auto;
      margin-right: auto;
      width: 980px;
      position: relative;
      padding: 20px 0 20px 0;
    }

    .wrap h1 {
      font-size: 2.3em;
      color: #333;
      padding: 30px 0 10px 0;
    }

    .wrap p {
      font-size: 16px;
      padding: 0 0 10px 0;
    }

    .box {
      display: block;
      background: #f2f2f2;
      border: 1px solid #ccc;
      padding: 20px;
      margin: 20px 0;
    }

    /* Centered texts in each section
    * --------------------------------------- */
    .section {
      text-align: center;
    }


    /* Bottom menu
    * --------------------------------------- */
    #infoMenu li a {
      color: #000;
    }

    .btnSubmit {
      border: none;
      border-radius: 1.5rem;
      padding: 1%;
      width: 20%;
      cursor: pointer;
      background: #0062cc;
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="fullpage">
    <div class="section " id="section0">
      <div class="slide">
        <div class="off">
          <img src="assets/media/off-cloud.png" class="offline-img slide-fwd-center" />
          <h3>CLEVER Server is unavailable now.</h3>
          <h3>Please perform the following checks:</h3>
          <h4>1. Ensure that LAN cable on this controller or CLEVER server is securely connected.</h4>
          <h4>2. Verify that CLEVER server is powered on.</h4>
          <h4>3. Inspect the network switch to confirm that it is powered on.</h4>
        </div>
        <div>
          <button type="button" class="btnSubmit" id="config">Configure</button>
        </div>
      </div>
      <div class="slide">
        <div class="off">
          <video id="videads" data-autoplay autoplay muted controls="false" width="720px">
            <source src="assets/media/videoplayback1.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
      <div class="slide">
        <div class="off">
          <img src="assets/media/logo-left.jpg" class="logo-img" />
          <h3>CLEVER - Console Controller.</h3>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="assets/js/jquery.min.js"></script>
  <script type="text/javascript" src="assets/js/fullpagejs/fullpage.min.js"></script>

  <script type="text/javascript">
    var slideTimeout
    $('#config').on('click', function () {
      if (window.cleverPlayer) {
        window.cleverPlayer.loadConfigure()
      }
    })
    $('#fullpage').fullpage({
      anchors: ['firstPage'],
      sectionsColor: ['#ffffff'],
      autoScrolling: false,
      css3: true,
      fitToSection: false,
      scrollOverflow: false,
      slidesNavigation: true,
      slidesNavPosition: 'bottom',
      afterRender: function () {
        //on page load, start the slideshow
        slideTimeout = setInterval(function () {
          $.fn.fullpage.moveSlideRight()
        }, 60000)
      },
      onLeave: function (index, direction) {
        //after leaving section 1 (home) and going anywhere else, whether scrolling down to next section or clicking a nav link, this SHOULD stop the slideshow and allow you to navigate the site...but it does not
        if (index == '1') {
          clearInterval(slideTimeout)
        }
      }
    })
  </script>
</body>

</html>
